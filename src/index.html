<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <!-- maximum-scale + user-scalable kill accidental pinch/double-tap zoom on touch devices
             (iOS ignores user-scalable but honours the rest + our touch-action CSS); viewport-fit
             lets the scene extend under notches (safe-area insets pad the joystick). -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

        <title>🌀 Utanomori 🌀</title>
        <!-- Dark base so the very first paint matches the loader (keep in sync with
             soundJourneyPalette.loaderBackground), not the lighter scene clear colour. -->
        <style>
            html,
            body {
                background: #010011;
            }
        </style>
        <!-- Favicon (in public/) -->
        <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any" />
        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
        <link rel="apple-touch-icon" href="/favicon.ico" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./index.jsx"></script>
    </body>
</html>
